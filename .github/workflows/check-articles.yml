name: Cek artikel

# Memastikan setiap artikel di halaman Artikel memuat Google Analytics dan tombol Bagikan (share-card.js).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Periksa GA + share-card.js di semua artikel
        run: node scripts/check-articles.mjs
